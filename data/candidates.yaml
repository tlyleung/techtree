# Future-technology candidates for technologytree.org: steps 1-2 of
# "Generating future candidates" in PLAN.md. Gathered from Alpha Centauri and
# Beyond Earth, the IEA Clean Energy Technology Guide and recent news,
# Kurzweil's books and Universal Paperclips, and Manifold and Metaculus.
# Nodes are field-level, named in the style of the Civ games; narrow wins are
# milestones filed under them. Nodes first (by band), then milestones and forecasts.
# Unverified: every entry still needs the research and check of step 4.
# 'pick' records the maintainer's choice. Check with: npm run candidates
- id: ai-scientific-discovery
  name: AI Scientists
  definition: An AI system autonomously proposes and validates a discovery that the relevant field treats as a major result (e.g. one cited in a Nobel-level prize citation or a top-journal headline result), with humans only running instruments.
  type: node
  branch: ai
  band_guess: late-2020s
  requires:
    - computers
  missing_history:
    - machine learning
  aspiration: 3
  evidence: 2
  sources:
    - source: manifold
      ref: https://manifold.markets/Gigacasting/ai-major-scientific-discovery-by-20
    - source: manifold
      ref: https://manifold.markets/level2/will-ai-make-an-unambiguously-novel
  notes: 'Manifold: ''AI: major scientific discovery by 2030'' 90% (n=51); ''unambiguously novel discovery in 2026'' 79% (n=25). Overlaps with ai-millennium-prize-proof and ai-nobel-prize; it may be better as their parent. The definition is soft and needs a concrete resolution rule.'
- id: autonomous-robotic-surgery
  name: Robot Surgeons
  definition: A robot performs a complete surgical procedure on a living human patient with no human control of the instruments (surgeons only supervise).
  type: node
  branch: medicine
  band_guess: late-2020s
  requires:
    - robotics
  missing_history:
    - machine learning
    - surgical robots
  aspiration: 3
  evidence: 3
  sources:
    - source: manifold
      ref: https://manifold.markets/JamesF/will-a-robot-complete-a-surgery-wit
    - source: manifold
      ref: https://manifold.markets/Favilar/will-hospitals-have-surgical-robots
    - source: manifold
      ref: https://manifold.markets/brp/will-the-fda-approve-a-fully-autono
    - source: other
      ref: https://hub.jhu.edu/2025/07/09/robot-performs-first-realistic-surgery-without-human-help
    - source: kurzweil
      ref: The Singularity Is Nearer (2024), ch.6 (robotic surgeons replacing human surgeons 'over the next decade or two')
  notes: |-
    [forecast markets] Manifold: full surgery with no human intervention before 2030 45% (n=46); >75% autonomous before 2030 30% (n=35); FDA approves a fully autonomous device before 2030 21% (n=10). JHU's SRT-H did an autonomous cholecystectomy phase on ex-vivo tissue (2025), and STAR operated on a live pig (2022). No autonomous human case found as of 2026-11.
    [Kurzweil and Paperclips, as autonomous-surgery-human] Alternative definition: A robot performs a complete standard operation (e.g. cholecystectomy) on a living human patient with no human control of the instruments.
    [Kurzweil and Paperclips, as autonomous-surgery-human] Johns Hopkins SRT-H (Science Robotics, July 2025) did all 17 tasks of a gallbladder removal phase on ex-vivo pig tissue with 100% success, still accepting voice corrections. STAR did a soft-tissue anastomosis in live pigs (2022). Kurzweil's date is vague (2034-2044 at face value).
- id: bci-speech-restoration
  name: Brain Implants
  definition: A regulator approves an implanted brain-computer interface that lets a paralysed person speak or type in real time.
  type: node
  branch: medicine
  band_guess: late-2020s
  requires:
    - computers
    - biology
  missing_history:
    - brain-computer interface (BrainGate 2004)
    - machine learning
  aspiration: 3
  evidence: 3
  sources:
    - source: other
      ref: https://www.uofmhealth.org/news-release/university-michigan-implants-first-human-paradromics-wireless-brain-computer-interface-designed
    - source: other
      ref: https://www.bloomberg.com/news/articles/2025-11-20/neuralink-rival-paradromics-cleared-to-start-brain-implant-trial
    - source: other
      ref: https://www.nih.gov/news-events/nih-research-matters/brain-computer-device-helps-man-speak
    - source: alpha-centauri
      ref: Sid Meier's Alpha Centauri (1999), 'Mind/Machine Interface' and 'Neural Grafting'
    - source: beyond-earth
      ref: 'Civilization: Beyond Earth (2014), ''Cybernetics'''
    - source: other
      ref: https://en.wikipedia.org/wiki/Brain%E2%80%93computer_interface
  notes: |-
    [IEA and near-term] Research demos of BCI speech restoration already exist (UC Davis 2024, ~97% accuracy; home use reported in Nature Medicine June 2026), so the 'first demonstration' must be regulatory approval or a commercial product. Paradromics Connexus first implant June 2026 (U. Michigan), first participant conversing via synthetic voice by Sep 2026; 10-patient trial. Neuralink speech claims are unverified secondary reports. Approval ~2029-2031: borderline band.
    [game trees, as brain-computer-interface] Alternative definition: An implanted interface lets a paralysed person communicate at a natural speaking rate (over 100 words a minute) with under 5% word errors, used at home for a year.
    [game trees, as brain-computer-interface] Speech neuroprostheses reached ~60-80 words a minute in 2023 papers; check 2025-26 results, as this may already be met. A later, larger node could be a BCI for healthy users.
- id: commercial-smr
  name: Modular Reactors
  definition: A factory-standardised light-water SMR (under 300 MWe) enters commercial operation on a land-based grid.
  type: node
  branch: energy
  band_guess: late-2020s
  requires:
    - nuclear-fission
    - electricity
  missing_history:
    - nuclear power plant
    - floating SMR (Akademik Lomonosov
    - 2020)
    - HTR-PM pebble-bed SMR (commercial Dec 2023)
  aspiration: 2
  evidence: 3
  sources:
    - source: iea
      ref: 'https://www.iea.org/data-and-statistics/data-tools/etp-clean-energy-technology-guide (Nuclear/Fission: ''Water-cooled SMR'')'
    - source: other
      ref: https://wnn.world-nuclear.org/articles/chinese-smr-completes-non-nuclear-steam-start-up-test
    - source: other
      ref: https://www.powermag.com/canada-approves-first-grid-scale-smr-construction-at-darlington
    - source: manifold
      ref: https://manifold.markets/SanghyeonSeo/will-microsoft-power-its-data-cente
    - source: manifold
      ref: https://manifold.markets/NoitUK/rolls-royce-smr-nuclear-power-by-20
    - source: metaculus
      ref: https://www.metaculus.com/questions/8677/smr-nuclear-1-of-any-nations-energy-2030/
  notes: |-
    [IEA and near-term] IEA TRL 2025: water-cooled SMR 7; HTGR SMR 8; sodium-fast 5; molten-salt 4; lead-fast 4; heat-pipe 5. BORDERLINE: 'SMR in commercial operation' arguably already happened (Russia's floating Akademik Lomonosov 2020; China's HTR-PM 2023), so I narrowed to land-based light-water. China's Linglong One (ACP100, 125 MWe) planned H1 2026 but still pre-commissioning per Sep 2026 reports (PRIS: under construction May 2026). OPG BWRX-300 at Darlington: construction licence Apr 2025, completion end-2029, grid 2030.
    [forecast markets, as first-commercial-smr] Alternative definition: A land-based small modular reactor (<300 MWe, factory-built modules) is connected to the grid and enters commercial operation.
    [forecast markets, as first-commercial-smr] China's Linglong One (ACP100, 125 MWe, Hainan) targeted commercial operation in H1 2026; IAEA PRIS still showed 'under construction' in May 2026, so check its status. Manifold: Microsoft powers a datacentre with an SMR by 2030 35% (n=39); Rolls-Royce SMR power by 2030 12% (n=23); mirror of the Metaculus question 'SMRs supply 1% of any nation's electricity by 2030' 15% (n=16). Russia's floating Akademik Lomonosov (2020) is a prior SMR-like plant; the definition says land-based to exclude it.
